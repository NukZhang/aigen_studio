server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: aigen-studio-backend

  datasource:
    url: jdbc:h2:file:/Users/admin/IdeaProjects/aigen_studio/data/aigendb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# iFlow Configuration
iflow:
  sdk:
    endpoint: https://platform.iflow.cn
    api-key: ${IFLOW_API_KEY:***REMOVED***}
    timeout: 60000  # 1 minute
    ui-task-timeout-ms: 300000  # UI prototype generation can be slower before first model response
    ui-heartbeat-interval-ms: 15000
    ui-heartbeat-initial-delay-ms: 15000
    code-task-timeout-ms: 600000  # Code generation often needs longer end-to-end execution time
    code-heartbeat-interval-ms: 15000
    code-heartbeat-initial-delay-ms: 15000
    auto-start-process: true
    file-access: true
    file-read-only: false
    file-max-size: 104857600  # 100MB
    output-dir: ${IFLOW_OUTPUT_DIR:../../generated-code}
    permission-mode: AUTO
  api:
    key: ${IFLOW_API_KEY:}
    model: qwen3-coder-plus

# Feishu Bot Configuration
feishu:
  enabled: true
  app-id: cli_a92bd35379b81cb3
  app-secret: ${FEISHU_APP_SECRET:}
  domain: feishu

# GitLab Configuration
gitlab:
  url: https://git.longhu.net
  token: '***REMOVED***'
  base-path: AIGen
  timeout: 600000  # 10 minutes

# Tutorial Configuration
tutorial:
  base-path: tutorials

# LangChain4j Configuration (混合模式：Chat 用 iFlow，Embedding 用 Jina)
langchain4j:
  open-ai:
    chat-model:
      base-url: https://apis.iflow.cn/v1
      api-key: ${IFLOW_API_KEY:sk-placeholder}
      model-name: qwen3-max
      temperature: 0.7
      max-tokens: 4096
    embedding-model:
      # 使用 Jina embedding 服务 (OpenAI 兼容格式)
      base-url: https://api.jina.ai/v1
      api-key: ${JINA_API_KEY:sk-placeholder}
      model-name: jina-embeddings-v2-base-zh

# Qdrant Configuration
qdrant:
  enabled: false
  host: localhost
  port: 6334
  collection-name: aigen_knowledge

# Prompt templates
aigen:
  agent:
    enable-rag: true
    enable-multi-agent: true
    use-langchain: true
  rag:
    search-cache-enabled: true
    search-cache-ttl-seconds: 120
    search-cache-max-size: 500
    alert-enabled: true
    alert-min-requests: 20
    alert-max-miss-rate: 0.60
    alert-log-cooldown-seconds: 300
    perf-latency-threshold-ms: 100
    perf-sample-size: 200
    perf-min-samples: 30
    embedding-batch-size: 16
    conversation-index-timeout-ms: 1500
  prompt:
    understanding-template: classpath:prompt-templates/understanding-prompt.md
    code-generation-template: classpath:prompt-templates/code-generation-prompt.md
    ui-prototype-template: classpath:prompt-templates/ui-prototype-prompt.md
  sdac:
    schemas:
      ui-spec: classpath:sdac/schemas/ui_spec.v1.schema.json
      implementation-plan: classpath:sdac/schemas/implementation_plan.v1.schema.json
      evidence-manifest: classpath:sdac/schemas/evidence_manifest.v1.schema.json
      preview-contract: classpath:sdac/schemas/preview_contract.v1.schema.json
    templates:
      ai2ai-state-update: classpath:sdac/templates/ai2ai_state_update.template.md
    gates:
      rules: classpath:sdac/gates/gate_rules.v1.yml

# Logging
logging:
  level:
    com.aigen.studio: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
